schema_version: 1
study_id: jspace-gemma-transport-study2
evidence_id: gm2-backend-parity-calibration-v1
foundation_evidence_id: gm2-foundation-v1
tier: methods
status: FROZEN_PRE_G2_1
branch: interp_jspace_gemma_transport_2
shared_parent_commit: 901fb4fc7578a913088c7947a2e6240f7fc45aeb
run_root: /content/drive/MyDrive/interpret/special-lab-1/gemma_transport_2_20260803

target_firewall:
  derivation_reads_only:
    - this config
    - raw G2.1 backend-versus-backend rows
  forbidden_until_ceiling_file_is_frozen:
    - study-1 Stage-1 summary
    - study-1 Stage-1 row table
    - study-1 backend-parity artifact and raw tensor
    - gm2_stage1_relicense.yaml
    - any Stage-1 tangent-versus-response outcome or classifier
  historical_target_literal_forbidden_in_calibration_source: true
  ceiling_freeze_precedes_registry_append: true

models:
  gemma4_31b:
    model_id: google/gemma-4-31B-it
    revision: 842da3794eaa0b77d5f08bae87a17459d91ff475
    layers_zero_indexed: [22, 37, 52]
    expected_outer_model_type: gemma4
    expected_text_model_type: gemma3_text
    expected_decoder_layers: 60
  olmo3_32b_control:
    model_id: allenai/Olmo-3-32B-Think
    revision: ebd033e4f0b284d5973b82c0ccb62ad0dbe877d7
    layers_zero_indexed: [24, 40, 56]
    expected_model_type: olmo3
    expected_decoder_layers: 64

prompt_bank: repo://interpretability/jspace_gemma/data/g1_prompts_v1.jsonl
prompt_ids: [gm-p001, gm-p002, gm-p003, gm-p004]
source_position: -1
target:
  representation: final_residual
  position_indices: [-1]
attention_implementation: eager
cache_policy: no_cache
model_dtype: bfloat16
accumulation_dtype: float32
allow_tf32: false

batch_sizes: [1, 4, 8]
slot_policy:
  compare_every_slot: true
  selected_slot: 0
  batch_construction: repeat one clean prompt state and use independently seeded directions per slot
directions:
  base_seed: 24080321
  draws:
    - {family: rademacher, draw_id: rademacher-0, seed_offset: 0}
    - {family: gaussian, draw_id: gaussian-0, seed_offset: 1}
    - {family: sphere_tangent, draw_id: sphere-tangent-0, seed_offset: 2}
  activation_radial: excluded_zero_delivery_in_study1
exact_backends:
  primary: torch.func.jvp
  independent: torch.autograd.functional.jvp
  finite_difference_as_exact: forbidden

pair_count_contract:
  formula: 2 models x 3 layers x 4 prompts x 3 batch sizes x 3 direction draws
  expected_backend_pairs: 216
  op_screen_pairs_are_nested_not_additional: true
op_screen:
  enabled: true
  frozen_subset:
    prompts: [gm-p001, gm-p003]
    batch_sizes: [1, 8]
    directions: [rademacher-0]
    layer_role: mid
  suffixes: [full, attention_only, mlp_only]
  interpretation: diagnostic localization only; the full suffix defines the ceiling

row_fields:
  - model_id
  - model_revision
  - layer
  - prompt_id
  - prompt_sha256
  - batch_size
  - slot
  - direction_family
  - direction_id
  - direction_seed
  - dtype
  - backend_primary
  - backend_independent
  - primal_relative_error
  - tangent_cosine
  - tangent_relative_error
  - max_absolute_difference
  - max_difference_dtype_quanta
  - ten_dtype_quanta_relative_equivalent
  - deterministic_replay
  - suffix_variant
  - finite_or_exception_state

ceiling_rule:
  distribution: full-suffix finite rows with primal parity passing, all models/batches/slots
  relative_error_quantile: 0.99
  formula: max(3 * q99(tangent_relative_error), q99(ten_dtype_quanta_relative_equivalent))
  dtype_quantum_definition: >-
    For each reference tangent element, compute the absolute spacing to the
    next representable bfloat16 value at that magnitude. The row's one-quantum
    relative equivalent is the L2 norm of that spacing vector divided by the
    L2 norm of the reference tangent; multiply by ten before taking q99.
  bootstrap:
    resampling_unit: prompt
    draws: 5000
    interval: 0.90
    seed: 24080322
  per_model_route:
    normalized_q99_ratio_threshold: 2.0
    require_log_ratio_bootstrap_interval_excludes_zero: true

router:
  primal_parity_relative_error_ceiling: 0.000001
  path_ambiguity:
    batch1_tangent_cosine_floor: 0.995
    batch1_relative_error_over_ten_quantum_equivalent: 1.0
    reproducible_prompt_minimum: 2
    reproducible_same_model_layer_or_op: true
    any_nonfinite_exact_backend_is_blocking: true
  batch_composition_nuisance:
    batch8_to_batch1_q99_ratio_floor: 2.0
    batch8_q90_must_exceed_batch1_q99: true
    path_ambiguity_must_be_false: true
  architecture_dependent_floor:
    use_per_model_route_above: true
    path_ambiguity_must_be_false: true
  benign_scheduling_floor:
    fallback_if_no_other_route: true

acceptance:
  fresh_process_replays: 1
  row_order_permutations: 1
  raw_rows_required: true
  aggregate_reconstruction_required: true
  selected_and_all_slot_reconstruction_required: true
  no_stage1_target_read_assertion_required: true
  overwrite_forbidden: true
  checkpoint_every_pairs: 4
