imported_meaning: >-
  The official Think-SFT/DPO wedge is technically valid but capability-gated,
  with zero Bank-S facts capable on both direct and composed variants at
  either checkpoint; stage effects are missing, not zero, and SFT versus DPO
  is unresolved. H6 does not license an in-band finite-dose regime at
  L24/L32/L40 on Base or OLMo-3.1 Think over the frozen ladder; Think passes
  only the L56, epsilon 0.10 late anchor. The exact site-dose coverage
  required to map registered causal interventions onto the H6 ladder is
  unavailable in the historical archive. The OLMo Think/Instruct Bank-W pair
  design has power 0.7788 at 16 common capable families; 18 is the first
  simulated passing count, and no intervention is authorized from the current
  design. Study-1 sentence 2 remains an architecture-matched association;
  sentence 4 remains pending.
