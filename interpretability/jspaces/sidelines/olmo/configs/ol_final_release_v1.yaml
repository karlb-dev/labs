claim_resolution:
  sentence_2:
    status: narrowed-release-resolved
    wording: >-
      Across the tested, architecture-matched OLMo lineage, the first released
      Think transition is associated with substantial reorganization of
      J-mapped token and selected-span geometry without a material increase in
      measured sparse capacity; the design does not identify which training
      ingredient caused that change.
  sentence_4:
    status: explicitly-pending-gate-blocked
    wording: >-
      Existing Bank-S development evidence motivates an external-state-
      substitution hypothesis on the tested Think checkpoints, but the planned
      fact-paired Bank-W factorial was gated out at 16/20 common families; this
      release does not resolve an externalization mechanism.

