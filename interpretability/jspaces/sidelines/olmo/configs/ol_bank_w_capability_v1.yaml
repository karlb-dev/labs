selection:
  partition: development
  derivation: derived
  redundancy: once
  loads: [low, high]
  expected_families: 24
  expected_seeds_per_family: 8
  expected_rows_per_model: 384
  outcome_columns_allowed: false

answer_contract:
  endpoint: candidate-set-sequence-log-probability-argmax
  margin: true-sequence-log-probability-minus-best-wrong
  sequence_reduction: sum-token-log-probability
  prompt_rendering: raw-bank-prompt-piecewise-answer-concatenation
  labels: [amber, blue, coral, green, ivory, lilac, ochre, silver]
  aliases: [" amber", " blue", " coral", " green", " ivory", " lilac", " ochre", " silver"]
  require_distinct_token_sequences: true
  maximum_answer_tokens: 2
  runtime_candidate_batch_size: 8
  scoring_spec: p4-scoring-v1

capability_guard:
  baseline_accuracy_floor: 0.70
  low_high_accuracy_difference_sesoi: 0.08
  equivalence_interval_level: 0.90
  family_bootstrap_draws: 20000
  family_bootstrap_seed: 20260801
  family_capability_accuracy_floor_by_load: 0.70
  minimum_joint_common_families: 20
  failed_guard_status: descriptive-only
  joint_rule: >-
    First apply the accuracy and load-equivalence gates independently to each
    model. The primary model set is every independently passing model. Then
    require at least 20 family IDs whose within-family accuracy is at least
    0.70 at both loads for every model in that set. If the joint intersection
    fails, block P4-P3 rather than dropping an otherwise eligible model.
  locked_secondary_covariates:
    - baseline_answer_margin
    - prompt_token_count
    - answer_token_count

olmo_service_rule: >-
  In addition to preserving the source Phase 4 aggregation, the early service
  bundle passes only when OLMo-3.1 Think, OLMo-3.1 Instruct, and the imported
  Qwen reference all pass independently and their three-way capable-family
  intersection contains at least 20 families.

