claim_boundary: >-
  Development-tier matched-lineage descriptive geometry. Natural checkpoint
  differences do not identify a randomized Think-training effect. Instruct is
  a sibling endpoint, not a fourth Think-trajectory point. Geometry continuity
  does not establish sparse-selection or causal invariance. No Phase 4,
  confirmatory, replication, Gemma, or intervention outcome is opened.
