  late_layers: [48, 52, 56, 60]

sampling:
  stable_vocabulary_rows: 1024
  stable_vocabulary_selection: smallest-sha256-priority-over-common-nonspecial-token-id-and-token-string
  cka_rows: 512
  neighbor_rows: 1024
  neighbor_k: 20
  transport_probes: 64
  spectral_rank: 64
  spectral_oversample: 16
  spectral_power_iterations: 1
  base_seed: 20260803
  token_quantiles: [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]
  selection_position_population: all-7481-registered-capacity-positions
  selection_prefix: per-position-own-centered-k50-under-frozen-persistence-2-crossing
  rbo_p: 0.9
  projector_rank_relative_tolerance: 0.0001
  projector_batch_positions: 128
  persistent_direction_minimum_position_fraction: 0.01

operator_metrics:
  - raw_matrix_cosine
  - symmetric_relative_frobenius_delta
  - j_minus_identity_cosine_and_delta
  - j_minus_own_trace_projection_cosine_and_delta
  - randomized_top_singular_spectrum
  - estimated_stable_rank
  - random_transport_probe_cosine_and_relative_error
  - mapped_token_centered_linear_cka

token_metrics:
  - stable_sample_row_cosine_quantiles
  - bank_f_answer_and_bridge_rows
  - bank_s_answer_and_bridge_rows
  - bank_w_answer_and_state_rows
  - cross_bank_shared_token_rows
  - top20_neighbor_overlap_on_stable_sample
  - raw_and_mapped_row_norm_quantiles

selection_metrics:
  - selected_id_jaccard
  - finite_rank_biased_overlap
  - mapped_selected_span_projector_overlap
  - mapped_selected_span_principal_angles
  - numerical_rank
  - persistent_direction_overlap_across_positions
  - normalized_alias_equivalent_swap_fraction
  - marginal_gain_to_random_crossing_margin

readout_metrics:
  effective_gain_formula: model.norm.weight*rsqrt(1+rms_norm_eps)
  effective_unembedding_formula: lm_head.weight*effective_gain
  mapped_dictionary_formula: row_normalize(effective_unembedding@J_layer)
  plain_dictionary_formula: row_normalize(effective_unembedding)
  items:
    - raw_unembedding_row_cosine
    - effective_unembedding_row_cosine
    - final_norm_gain_cosine_and_scale
    - tied_or_untied_status
    - cross_checkpoint_plain_neighbor_ranking_overlap
    - cross_checkpoint_j_mapped_neighbor_ranking_overlap
    - j_minus_plain_neighbor_overlap

selection_margin_boundary:
  exact_kth_kplus1_score_gap:
    status: not-estimable-from-registered-o2-sufficient-statistics
    required_future_input: replayed-pursuit-correlation-log-compatible-with-phase4_3-top-k-margin-schema
  stable_core_near_tie_fringe:
    status: partially-estimable
    current_estimands:
      - exact-selected-prefix-persistence
      - normalized-alias-equivalent-swaps
      - marginal-gain-to-random-crossing-margin
    prohibited_label: kth-kplus1-score-margin
  protected_span_overlap:
    status: not-estimable-without-protected-direction-inputs
  causal_core_fringe_dose:
    status: blocked-by-olmo-phase4-service-gate
    blocking_evidence: ol-bank-w-capability-joint-dev-v1
  rule: Missing quantities remain explicit nulls and cannot be replaced by a proxy under the same name.

