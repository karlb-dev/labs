decision_router:
  broad_operator_continuity: >-
    Primary Base-to-3.0-Think raw-matrix cosine median across all source
    layers is at least 0.90 and its minimum across assay layers is at least
    0.85. This is a development descriptor, not an equivalence certificate.
  broad_token_continuity: >-
    Primary-edge stable-sample mapped-row cosine median across layers is at
    least 0.85 and the median layer-level q05 is at least 0.70.
  dictionary_formation_pattern: >-
    The Base-to-3.0 mapped-row cosine movement is at least 1.5 times the
    3.0-to-3.1 movement and exceeds it by at least 0.03.
  selection_divergence_flag: >-
    Median selected-ID Jaccard below 0.75 or median normalized projector
    overlap below 0.85. These reviewed Phase-4 stability cut points are used
    only as descriptive flags across checkpoints.
  instruct_late_shift: >-
    Sibling-edge late-layer movement exceeds early-layer movement by at least
    0.03; report whether operator, readout, or mapped rows contribute most.
  outcome_labels:
    - broad-continuity-with-selection-change
    - dictionary-formation-pattern
    - coordinate-drift-with-common-coarse-channel
    - mixed-or-unresolved

