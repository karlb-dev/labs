claim_boundary: >-
  Development-tier matched-lineage capacity measurement. It distinguishes
  measured sparse-capacity patterns from causal utilization but cannot assign
  checkpoint differences to a randomized training objective. Instruct is a
  sibling endpoint, not a fourth point on the Think trajectory. No Phase 4,
  confirmatory, replication, or intervention outcome is opened.
