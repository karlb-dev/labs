activation_population:
  layers: [24, 32, 40]
  maximum_content_tokens: 255
  content_tokenization: add_special_tokens-false
  bos_policy: explicitly-prepend-tokenizer-bos-when-exposed
  expected_content_sequence_manifest_sha256: 03edeb51f61bc64d8bb42dfca1cf69808773d45d28810be8085b327936a1052e
  require_all_model_content_sequences_identical: true
  skip_first_content_positions: 16
  short_prompt_tail_positions: 8
  exclude_final_content_position: true
  position_rule: >-
    For content length P, lo=min(16,max(P-8,1)); retain content positions
    lo through P-2 inclusive. BOS is never part of the activation population.
  expected_positions_under_shared_tokenization: 7481
  centering_population: all-retained-positions-within-model-and-layer
  centering_application: subtract-global-vector-before-sparse-pursuit
  model_dtype: bfloat16
  activation_storage_dtype: float32-cpu

estimator:
  primary_target: globally-centered-activation
  sensitivity_target: raw-uncentered-activation
  pursuit: greedy-positive-correlation-plus-projected-nonnegative-refit
  positive_support_exhaustion: true
  k_max: 50
  refit_iterations: 8
  refit_learning_rate_cap: 0.25
  pursuit_batch_positions: 48
  crossing:
    comparison: marginal-J-gain-less-than-or-equal-to-median-random-gain
    persistence: 2
    persistence_sensitivity: [1, 2, 3]
    no_crossing: right-censor-at-k-max
    median_convention: lower-median
  random_controls:
    number: 3
    seeds: [11, 12, 13]
    rows: match-model-vocabulary
    dimensions: match-hidden-size
    distribution: iid-standard-normal-row-normalized
    generation_device: cuda
    generation_dtype: float32
    storage_dtype: bfloat16
    chunk_rows: 4096
  dictionary:
    formula: row_normalize((unembedding * measured_final_norm_gain) @ J_layer)
    rows: full-model-vocabulary
    construction_accumulation_dtype: float32
    storage_dtype: bfloat16
    chunk_rows: 8192
  primary_share: centered-r2-at-centered-crossing-lower-median-occupancy
  centered_excess: primary-J-share-minus-mean-of-three-random-shares
  raw_sensitivity: raw-r2-at-raw-crossing-lower-median-occupancy
  strata: [factual, arithmetic, sql, prose]

uncertainty:
  unit: source-prompt
  bootstrap: stratified-prompt-cluster-percentile
  preserve_domain_counts: true
  draws: 2000
  interval_level: 0.90
  seed: 20260802
  centering_during_bootstrap: freeze-full-activation-population-mean
  paired_across_models: true
  save_distributions: true

decision_rules:
  primary_contrast: olmo3-base-to-olmo3-think
  centered_excess_equivalence_margin: 0.0025
  centered_excess_material_margin: 0.01
  stable: >-
    Absolute point difference below 0.0025, observed lower-median occupancy
    unchanged, and the 90% paired prompt-bootstrap interval wholly inside
    [-0.0025,+0.0025].
  small_shift: >-
    Point centered-excess difference from 0.0025 through 0.01 inclusive or
    absolute observed occupancy difference exactly one, provided uncertainty
    does not cross a material boundary.
  material_shift: >-
    Centered-excess interval wholly above +0.01 or below -0.01, or occupancy
    difference interval wholly above +1 or below -1.
  unresolved: >-
    Equivalence is not established and the interval crosses a material
    boundary, or a material point estimate is not supported by its interval.
  lineage_router: >-
    Call partial channel formation/growth supported only when the equal-layer
    Base-to-3.0-Think primary-own-frame contrast is a positive material shift.
    Call broadly conserved capacity/recruitment-consistent only when that
    aggregate is stable or a non-material small shift and no individual layer
    is a supported positive material shift. Otherwise return mixed/unresolved.

frames:
  primary: checkpoint-own-lens
  sensitivity: frozen-olmo3-base-lens
  base_own_equals_common: true

