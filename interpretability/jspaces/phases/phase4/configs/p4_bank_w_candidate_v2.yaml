evidence_id: p4-bank-w-candidate-v2
tier: methods
supersedes: p4-bank-w-candidate-v1
supersession_reason: >-
  Outcome-blind max-T calibration p4-bank-w-power-dev-v1 showed that the
  v1 minimum of 16 common families had only 70.3% power at the SESOI;
  v2 raises the floor to the first powered count, 20, without changing rows
  or family partitions.
power_evidence_id: p4-bank-w-power-dev-v1
model_uri: model://Qwen/Qwen3.6-27B@6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
# Preserve the already authored outcome-blind rows exactly.
namespace: p4-bank-w-candidate-v1

superfamilies:
  - key_value
  - state_updates
  - graph_path
  - stack_queue
  - deferred_recall
  - relational_table
families_per_superfamily: 12
seeds_per_family: 8
loads:
  low: 2
  high: 6
derivations: [supplied, derived]
redundancies: [once, redundant]
answer_alphabet: [amber, blue, coral, green, ivory, lilac, ochre, silver]

length_matching:
  maximum_pair_difference_tokens: 4
  filler_sentence: " Neutral marker; ignore it."
  maximum_padding_iterations: 256

shortcut_audit:
  maximum_excess_over_load_chance: 0.08
  answer_in_query_allowed: false
  require_balanced_target_positions: true

partition:
  development_families: 24
  confirmatory_families: 24
  replication_families: 24
  namespace: p4-bank-w-family-partition-v1

capability_guard:
  baseline_accuracy_floor: 0.70
  low_high_accuracy_difference_sesoi: 0.08
  minimum_common_families_per_model: 20
  fallback_covariates:
    - baseline_answer_margin
    - prompt_token_count
    - answer_token_count
  failed_guard_status: descriptive-only

primary:
  cell: derived_once
  low: low
  high: high
  model_slugs: [olmo31-think, olmo31-instruct, qwen36-27b]
  joint_test: shared-family-sign-flip-max-t
  alternative: positive-high-load-dependence
  monte_carlo_draws: 100000
  seed: 48151623

freeze_blocker: >-
  Model-specific baseline capability gates and independent protocol review
  remain pending. Power, SESOI, and the 20-family common-support floor are
  registered in p4-bank-w-power-dev-v1.

outputs:
  bank: interpretability/jspaces/phases/phase4/data/bank_w_candidate_v1.jsonl
  partition: interpretability/jspaces/phases/phase4/data/bank_w_partition_candidate_v1.json
  audit: interpretability/jspaces/phases/phase4/data/bank_w_audit_v2.json
