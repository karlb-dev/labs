name: ${COMPOSE_PROJECT_NAME:-aidataapps-ghosttype}

services:
  sqlserver:
    build:
      context: .
      dockerfile: docker/mssql-fts.Dockerfile
      args:
        SQLSERVER_BASE_IMAGE: ${SQLSERVER_BASE_IMAGE:-mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1}
        MSSQL_FTS_PACKAGE_VERSION: ${MSSQL_FTS_PACKAGE_VERSION:-17.0.4075.5-1}
    image: ${SQLSERVER_FTS_IMAGE:-aidataapps-ghosttype-mssql-fts:cu8}
    labels:
      ai.labs.lab: ghosttype
      ai.labs.role: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "6144"
      MSSQL_TCP_PORT: ${SQLSERVER_INTERNAL_PORT:-1435}
    ports:
      - "${SQLSERVER_PORT:-1435}:${SQLSERVER_INTERNAL_PORT:-1435}"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - run-exports:/var/opt/mssql/exports
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S "localhost,$$MSSQL_TCP_PORT" -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
    name: ${COMPOSE_PROJECT_NAME:-aidataapps-ghosttype}-sqlserver-data
  run-exports:
    name: ${COMPOSE_PROJECT_NAME:-aidataapps-ghosttype}-run-exports
