name: ${COMPOSE_PROJECT_NAME:-aidataapps-modelprint}

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "6144"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - run-exports:/var/opt/mssql/exports
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s
    restart: unless-stopped

  embedding-qwen:
    image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    command:
      - --model
      - Qwen/Qwen3-Embedding-0.6B
      - --revision
      - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --served-model-name
      - Qwen/Qwen3-Embedding-0.6B
      - --runner
      - pooling
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.06"
      - --max-num-seqs
      - "64"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
    ports:
      - "${EMBEDDING_PORT:-8001}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    # Long-form gpus syntax: the `gpus: all` shorthand fails compose config
    # validation on older compose releases (observed on Docker Desktop v2.32).
    gpus:
      - driver: nvidia
        count: all
    ipc: host
    restart: unless-stopped

  embedding-bge:
    image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    command:
      - --model
      - BAAI/bge-large-en-v1.5
      - --revision
      - d4aa6901d3a41ba39fb536a557fa166f842b0e09
      - --served-model-name
      - BAAI/bge-large-en-v1.5
      - --runner
      - pooling
      - --max-model-len
      - "512"
      - --gpu-memory-utilization
      - "0.06"
      - --max-num-seqs
      - "64"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ENABLE_CUDA_COMPATIBILITY: "1"
    ports:
      - "${SECOND_EMBEDDING_PORT:-8002}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    # Long-form gpus syntax: the `gpus: all` shorthand fails compose config
    # validation on older compose releases (observed on Docker Desktop v2.32).
    gpus:
      - driver: nvidia
        count: all
    ipc: host
    restart: unless-stopped

volumes:
  huggingface-cache:
    external: true
    name: ${SHARED_HF_VOLUME:-aidataapps-rag-huggingface-cache}
  sqlserver-data:
    name: ${COMPOSE_PROJECT_NAME:-aidataapps-modelprint}-sqlserver-data
  vllm-cache:
    external: true
    name: ${SHARED_VLLM_VOLUME:-aidataapps-rag-vllm-cache}
  run-exports:
    name: ${COMPOSE_PROJECT_NAME:-aidataapps-modelprint}-run-exports
