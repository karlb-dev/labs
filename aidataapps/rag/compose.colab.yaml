# Compatibility overrides for a Colab VM whose host is itself a container.
# Use with:
#   export COMPOSE_FILE=compose.yaml:compose.colab.yaml
#   export CONTAINER_RUNTIME_PROFILE=colab-rootless
#
# The outer container does not permit Docker to create new network, procfs, or
# cgroup mounts. Host namespaces plus read-only bind mounts avoid those nested
# mount operations. GPU access uses the NVIDIA CDI device generated by the
# Colab host bootstrap script instead of the legacy --gpus runtime hook.

services:
  sqlserver:
    network_mode: host
    pid: host
    ipc: host
    cgroup: host
    ports: !reset []
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - /proc:/proc:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  vllm-embedding:
    network_mode: host
    pid: host
    ipc: host
    cgroup: host
    ports: !reset []
    gpus: !reset []
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      LD_LIBRARY_PATH: /usr/lib64-nvidia:/usr/local/cuda/lib64:/usr/local/nvidia/lib64
    volumes:
      - /proc:/proc:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    command:
      - --model
      - ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --served-model-name
      - ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --runner
      - pooling
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.10"
      - --max-num-seqs
      - "32"
      - --port
      - ${EMBEDDING_PORT:-8001}
