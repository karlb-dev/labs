section { margin-top: 56px; }
.lede { color: var(--ink-2); max-width: 68ch; margin: 6px 0 22px; }

.tiles { display: grid; gap: 12px; }
.tile { background: var(--tile); border-radius: 8px; padding: 14px 16px; }

.chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: baseline; }
table.score { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tablewrap { overflow-x: auto; }

table.score th:first-child, table.score td:first-child { text-align: left; }

.best { color: var(--good-text); font-weight: 600; }
.charts4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

.chart-card h3 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.chart-card .note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

.hbar-name { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.hbar-track { height: 12px; position: relative; }
.hbar-track::before { content: ""; position: absolute; inset: 5px 0; border-left: 1px solid var(--baseline); }
.hbar-fill { height: 12px; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar-val { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 4px; font-size: 12.5px; color: var(--ink-2); }
.legend .mono { font-size: 11.5px; }
svg text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.grid16 { border-collapse: separate; border-spacing: 3px; }
.grid16 th { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); font-weight: 500; text-transform: none; padding: 2px 6px; }
.grid16 td.ep { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-2); white-space: nowrap; padding-right: 10px; }
.cell { width: 30px; height: 24px; border-radius: 5px; text-align: center; font-size: 12px; line-height: 24px; color: #fff; font-family: "IBM Plex Mono", monospace; }
.c-triple { background: var(--good); }
.c-class { background: var(--warn); color: #1a1a19; }
.c-wrong { background: var(--serious); color: #1a1a19; }
.c-none { background: transparent; border: 1px dashed var(--baseline); color: var(--muted); }
.gear { color: var(--muted); font-size: 10px; }

.dossier p { font-size: 13.5px; color: var(--ink-2); margin: 0 0 10px; }

const N = DATA.narrative;
const fmtPct = v => v === null || v === undefined ? "—" : (v * 100).toFixed(v === 0 || v === 1 ? 0 : 1).replace(/\.0$/, "") + "%";
const fmt = (v, s = "") => v === null || v === undefined ? "—" : v + s;
const slotVar = m => `--s${m.slot}`;
const chip = m => `<span class="chip" style="background:var(${slotVar(m)})"></span>`;

const tip = document.getElementById("tip");
const put = (id, html) => { document.getElementById(id).innerHTML = html; };

// Hero + narrative scaffolding
put("eyebrow", N.eyebrow);
put("pageTitle", N.title);
put("subtitle", N.subtitle);
put("metaRow", DATA.meta.map(x => `<span>${x}</span>`).join(""));
put("verdict", N.verdict.map(p => `<p>${p}</p>`).join(""));
put("tiles", N.tiles.map(t => `<div class="tile"><div class="lab">${t.lab}</div><div class="val">${t.val}</div><div class="sub2">${t.sub}</div></div>`).join(""));

put("qualityTitle", N.quality.title); put("qualityLede", N.quality.lede);
put("scatterTitle", N.scatter.title); put("scatterLede", N.scatter.lede);
put("gridTitle", N.grid.title); put("gridLede", N.grid.lede);
put("dossierTitle", N.dossierTitle);
put("ablationKicker", N.ablation.kicker); put("ablationTitle", N.ablation.title); put("ablationLede", N.ablation.lede);

put("caveatTitle", N.caveatTitle);
put("caveats", N.caveats.map(c => `<li>${c}</li>`).join(""));
if (N.ablation.cards.length === 0) document.getElementById("ablationSection").style.display = "none";

// Scoreboard (numbers computed from rows by the generator, never hand-entered)
const cols = [
  ["Model", m => chip(m) + m.name],
  ["Size", m => fmt(m.gb, " GB")], ["Class", m => fmtPct(m.cls)], ["Severity", m => fmtPct(m.sev)],
  ["Action", m => fmtPct(m.act)], ["Triple", m => fmtPct(m.triple)],
  ["First-pass JSON", m => fmtPct(m.fp)], ["Legal contract", m => fmtPct(m.legal)],
  ["Req. tool first", m => fmtPct(m.toolFirst)], ["Tool args", m => fmtPct(m.args)],
  ["Spurious tools", m => fmtPct(m.spur)], ["tok/s", m => fmt(m.tps)], ["s/episode", m => fmt(m.lat)],
  ["Load s", m => fmt(m.load)], ["Decisions", m => m.dec]
];
const bestCols = { "Class":"cls","Severity":"sev","Action":"act","Triple":"triple","First-pass JSON":"fp","Legal contract":"legal","tok/s":"tps" };
put("scoreTable", "<tr>" + cols.map(c => `<th>${c[0]}</th>`).join("") + "</tr>" +
  DATA.models.map(m => "<tr>" + cols.map(c => {
    const metricKey = bestCols[c[0]];
    let klass = "";
    if (metricKey && m[metricKey] !== null && m[metricKey] !== undefined) {
      const vals = DATA.models.map(x => x[metricKey]).filter(v => v !== null && v !== undefined);
      if (m[metricKey] === Math.max(...vals) && Math.max(...vals) > 0) klass = "best";
    }
    return `<td class="${klass}">${c[1](m)}</td>`;
  }).join("") + "</tr>").join(""));

// Quality small multiples
const dims = [["cls","Incident class","what happened"],["sev","Severity","how bad, per rubric"],["act","Action","what to do, per rubric"],["triple","Exact triple","all three at once"]];
put("qualityCharts", dims.map(([k, title, note]) => `
  <div class="chart-card"><h3>${title}</h3><p class="note">${note}</p>` +
  DATA.models.map(m => `
    <div class="hbar-row" data-tt="${m.name}: ${fmtPct(m[k])} ${title.toLowerCase()}">
      <span class="hbar-name">${m.name}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(m[k] ?? 0) * 100}%;background:var(${slotVar(m)})"></div></div>
      <span class="hbar-val">${fmtPct(m[k])}</span>
    </div>`).join("") + "</div>").join(""));
put("modelLegend", DATA.models.map(m => `<span>${chip(m)}<span class="mono">${m.name} · ${fmt(m.gb," GB")} · ${m.runtime}</span></span>`).join(""));

// Scatter: tok/s (log2) vs triple accuracy
(function buildScatter() {
  const W = 960, H = 380, L = 56, R = 30, T = 20, B = 46;
  const pts = DATA.models.filter(m => m.tps !== null && m.tps !== undefined && m.triple !== null && m.triple !== undefined);
  if (pts.length === 0) { document.getElementById("scatter").innerHTML = ""; return; }
  const xmin = 8, xmax = 256;
  const xp = v => L + (Math.log2(Math.max(v, xmin)) - Math.log2(xmin)) / (Math.log2(xmax) - Math.log2(xmin)) * (W - L - R);
  const yp = v => T + (1 - v) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Decode speed versus exact-triple accuracy">`;
  for (let v = 0; v <= 1.0001; v += 0.25) {
    s += `<line x1="${L}" y1="${yp(v)}" x2="${W-R}" y2="${yp(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${L-8}" y="${yp(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v*100)}%</text>`;
  }
  [8,16,32,64,128,256].forEach(v => {
    s += `<line x1="${xp(v)}" y1="${T}" x2="${xp(v)}" y2="${H-B}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${xp(v)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${v}</text>`;
  });
  s += `<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">decode tokens / second (log scale)</text>`;
  s += `<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--baseline)" stroke-width="1"/>`;
  const offsets = N.scatterLabelOffsets ?? {};
  pts.forEach((m, i) => {
    const r = 6 + Math.sqrt(m.gb) * 3.4;
    const [dx, dy] = offsets[m.key] ?? [12, i % 2 === 0 ? -10 : 16];
    s += `<circle cx="${xp(m.tps)}" cy="${yp(m.triple)}" r="${r}" fill="var(${slotVar(m)})" fill-opacity="0.85" stroke="var(--surface)" stroke-width="2" data-tt="${m.name}: ${m.tps} tok/s · ${fmtPct(m.triple)} triple · ${m.gb} GB"/>`;
    const anchor = dx < 0 ? "end" : "start";
    s += `<text x="${xp(m.tps) + (dx < 0 ? -r + dx : r + dx)}" y="${yp(m.triple) + dy}" font-size="11.5" fill="var(--ink-2)" text-anchor="${anchor}">${m.name}</text>`;
  });
  s += "</svg>";
  document.getElementById("scatter").innerHTML = s;
})();

// Episode grid
const glyph = { triple: "✓", class: "◐", wrong: "✗", none: "∅" };
const stateName = { triple: "exact triple", class: "right class, wrong severity/action", wrong: "wrong class", none: "no decision" };
put("epGrid", "<tr><th></th>" + DATA.models.map(m => `<th>${chip(m)}${m.name}</th>`).join("") + "</tr>" +
  DATA.episodes.map((e, i) => `<tr><td class="ep">${e.id} ${e.tool ? '<span class="gear">⚙</span>' : ""} <span style="color:var(--muted)">${e.short}</span></td>` +
    DATA.models.map(m => {
      const st = (DATA.grid[m.key] ?? [])[i] ?? "none";
      return `<td><div class="cell c-${st}" data-tt="${m.name} · ${e.id} ${e.short}: ${stateName[st]}">${glyph[st]}</div></td>`;
    }).join("") + "</tr>").join(""));

// Dossiers
put("dossiers", N.dossiers.map(d => {
  const m = byKey[d.key];
  return `<div class="dossier" style="--dcolor:var(${m ? slotVar(m) : "--baseline"})"><h3>${d.title}</h3><div class="facts">${d.facts}</div><p>${d.body}</p><div class="snippet">${d.snip.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div></div>`;
}).join(""));
if (N.dossiers.length === 0) document.getElementById("dossierSection").style.display = "none";

// Tooltips
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tt]");
  if (t) showTip(e, t.getAttribute("data-tt")); else tip.style.opacity = 0;
});
</script>
